version: '3.8'

services:
  # Base de datos principal relacional
  postgres:
    image: postgres:15-alpine
    container_name: codenexus-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: codenexus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Caché, WebSockets Pub/Sub y gestión de estado efímero
  redis:
    image: redis:7-alpine
    container_name: codenexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Cola de mensajes para el Execution Engine
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: codenexus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus_password
    ports:
      - "5672:5672"   # Protocolo AMQP
      - "15672:15672" # Interfaz de Management
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  # Object Storage (para assets del laboratorio, avatares, proyectos)
  minio:
    image: minio/minio:RELEASE.2023-08-09T23-30-22Z
    container_name: codenexus-minio
    environment:
      MINIO_ROOT_USER: nexus_admin
      MINIO_ROOT_PASSWORD: nexus_password_123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola de Administración
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # Worker aislado de Python y otros lenguajes
  python-sandbox:
    build:
      context: ./backend/workers/python-sandbox
    container_name: codenexus-python-worker
    environment:
      RABBITMQ_URL: amqp://nexus:nexus_password@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - sandbox-db
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # Base de datos aislada para el modo Sandbox (SQL Premium)
  sandbox-db:
    image: postgres:15-alpine
    container_name: codenexus-sandbox-db
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox_password
      POSTGRES_DB: pagila
    ports:
      - "5434:5432"
    volumes:
      - ./backend/workers/python-sandbox/init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
